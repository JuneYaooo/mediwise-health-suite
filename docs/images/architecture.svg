<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">MediWise Health Suite 架构与数据边界</title>
  <desc id="desc">个人本地用户请求经过运行模式检查和 Node.js 路由进入六个健康领域 Skill，再由 Python 数据层写入本地 medical.db 与 lifestyle.db。视觉、食物和设备外部服务只有在显式配置后访问。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#163A34" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10 Z" fill="#5D7B75"/>
    </marker>
    <marker id="arrowExternal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10 Z" fill="#C0644B"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2.4px; fill: #1E7A6E; }
      .title { font-size: 42px; font-weight: 760; letter-spacing: -1px; fill: #153832; }
      .subtitle { font-size: 18px; font-weight: 450; fill: #5D716D; }
      .label { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #1E7A6E; }
      .nodeTitle { font-size: 23px; font-weight: 720; fill: #173B35; }
      .nodeBody { font-size: 15px; font-weight: 450; fill: #60746F; }
      .smallTitle { font-size: 16px; font-weight: 680; fill: #21443E; }
      .smallBody { font-size: 13px; font-weight: 450; fill: #6B7D79; }
      .dbTitle { font-size: 18px; font-weight: 720; fill: #FFFFFF; }
      .dbBody { font-size: 12px; font-weight: 500; fill: #DCEBE8; }
      .externalTitle { font-size: 16px; font-weight: 700; fill: #7C3929; }
      .externalBody { font-size: 13px; font-weight: 470; fill: #8A5A4E; }
    </style>
  </defs>

  <rect width="1440" height="860" fill="#F4F8F7"/>
  <circle cx="1320" cy="92" r="102" fill="#E4F1EE" opacity="0.72"/>
  <circle cx="1375" cy="42" r="34" fill="#D8EAF7" opacity="0.85"/>

  <g class="sans">
    <text x="64" y="62" class="eyebrow">LOCAL-FIRST HEALTH DATA FLOW</text>
    <text x="64" y="112" class="title">MediWise 架构与数据边界</text>
    <text x="64" y="145" class="subtitle">身份先于数据 · 医疗与生活方式分域存储 · 外部能力按需开启</text>

    <g transform="translate(1010 68)">
      <rect width="104" height="34" rx="17" fill="#E4F1EE"/>
      <text x="52" y="22" text-anchor="middle" class="smallTitle" fill="#1E7A6E">SQLite</text>
      <rect x="114" width="132" height="34" rx="17" fill="#E3EDF8"/>
      <text x="180" y="22" text-anchor="middle" class="smallTitle" fill="#2F6FEB">本地档案</text>
      <rect x="256" width="126" height="34" rx="17" fill="#F6E8E2"/>
      <text x="319" y="22" text-anchor="middle" class="smallTitle" fill="#A94F38">云端可选</text>
    </g>

    <rect x="42" y="180" width="1356" height="476" rx="26" fill="#FFFFFF" stroke="#79A99F" stroke-width="2" stroke-dasharray="10 9"/>
    <rect x="66" y="164" width="238" height="34" rx="17" fill="#1E7A6E"/>
    <text x="185" y="186" text-anchor="middle" font-size="14" font-weight="750" letter-spacing="1.5" fill="#FFFFFF">LOCAL / PRIVATE BOUNDARY</text>

    <g filter="url(#shadow)">
      <rect x="78" y="288" width="194" height="148" rx="20" fill="#F8FBFA" stroke="#D7E5E1"/>
    </g>
    <circle cx="126" cy="334" r="22" fill="#DDEEEA"/>
    <circle cx="126" cy="328" r="7" fill="#1E7A6E"/>
    <path d="M112 348 C114 335 138 335 140 348" fill="#1E7A6E"/>
    <text x="160" y="331" class="nodeTitle">用户</text>
    <text x="160" y="354" class="nodeBody">OpenClaw / 私聊</text>
    <line x1="102" y1="380" x2="246" y2="380" stroke="#D8E4E1"/>
    <text x="102" y="405" class="nodeBody">自然语言 · 图片 · PDF</text>

    <path d="M278 362 H326" fill="none" stroke="#5D7B75" stroke-width="2" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="336" y="246" width="242" height="232" rx="20" fill="#F8FBFA" stroke="#D7E5E1"/>
    </g>
    <text x="364" y="284" class="label">REQUEST GATE</text>
    <text x="364" y="322" class="nodeTitle">请求与路由</text>
    <rect x="364" y="346" width="186" height="44" rx="10" fill="#E4F1EE"/>
    <text x="382" y="374" class="smallTitle">个人本地运行模式</text>
    <rect x="364" y="400" width="186" height="44" rx="10" fill="#E3EDF8"/>
    <text x="382" y="428" class="smallTitle">Node.js action 路由</text>
    <text x="364" y="464" class="smallBody">日志不记录健康参数与凭据</text>

    <path d="M584 362 H630" fill="none" stroke="#5D7B75" stroke-width="2" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="640" y="218" width="354" height="288" rx="20" fill="#F8FBFA" stroke="#D7E5E1"/>
    </g>
    <text x="668" y="256" class="label">DOMAIN SKILLS</text>
    <text x="668" y="290" class="nodeTitle">六个健康领域</text>

    <g>
      <rect x="668" y="316" width="142" height="54" rx="12" fill="#E4F1EE"/>
      <text x="739" y="339" text-anchor="middle" class="smallTitle">健康档案</text>
      <text x="739" y="358" text-anchor="middle" class="smallBody">就诊 · 用药 · 指标</text>

      <rect x="824" y="316" width="142" height="54" rx="12" fill="#EDF3FA"/>
      <text x="895" y="339" text-anchor="middle" class="smallTitle">饮食追踪</text>
      <text x="895" y="358" text-anchor="middle" class="smallBody">来源 · 餐次 · 营养</text>

      <rect x="668" y="382" width="142" height="54" rx="12" fill="#EDF3FA"/>
      <text x="739" y="405" text-anchor="middle" class="smallTitle">体重运动</text>
      <text x="739" y="424" text-anchor="middle" class="smallBody">趋势 · 目标 · 围度</text>

      <rect x="824" y="382" width="142" height="54" rx="12" fill="#E4F1EE"/>
      <text x="895" y="405" text-anchor="middle" class="smallTitle">睡眠追踪</text>
      <text x="895" y="424" text-anchor="middle" class="smallBody">分期 · 日报 · 周趋势</text>

      <rect x="668" y="448" width="142" height="34" rx="10" fill="#F1F5F4"/>
      <text x="739" y="470" text-anchor="middle" class="smallTitle">健康监测</text>

      <rect x="824" y="448" width="142" height="34" rx="10" fill="#F1F5F4"/>
      <text x="895" y="470" text-anchor="middle" class="smallTitle">可穿戴同步</text>
    </g>

    <path d="M1000 362 H1046" fill="none" stroke="#5D7B75" stroke-width="2" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="1056" y="246" width="306" height="232" rx="20" fill="#173F38"/>
    </g>
    <text x="1084" y="284" font-size="14" font-weight="750" letter-spacing="1.5" fill="#97C9BE">PYTHON DATA LAYER</text>
    <text x="1084" y="320" font-size="23" font-weight="720" fill="#FFFFFF">本地数据访问层</text>
    <text x="1084" y="346" class="dbBody">事务 · 数据校验 · 审计 · 私有权限</text>

    <rect x="1084" y="372" width="118" height="72" rx="13" fill="#235C52" stroke="#3B776C"/>
    <text x="1100" y="400" class="dbTitle">medical.db</text>
    <text x="1100" y="423" class="dbBody">病历 / 指标 / 用药</text>

    <rect x="1216" y="372" width="118" height="72" rx="13" fill="#275C80" stroke="#44789A"/>
    <text x="1232" y="400" class="dbTitle">lifestyle.db</text>
    <text x="1232" y="423" class="dbBody">饮食 / 体重 / 设备</text>

    <text x="78" y="612" class="smallBody">默认路径位于系统用户数据目录 · 数据目录 0700 · 数据库、配置、附件与备份 0600</text>

    <text x="64" y="704" font-size="14" font-weight="750" letter-spacing="1.5" fill="#A94F38">OPTIONAL EXTERNAL SERVICES</text>
    <text x="64" y="732" class="nodeBody">只有显式配置后才访问；虚线表示数据离开本地边界</text>

    <path d="M784 506 V686" fill="none" stroke="#C0644B" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrowExternal)"/>

    <g>
      <rect x="614" y="754" width="244" height="76" rx="16" fill="#FBF1ED" stroke="#E7B8AA"/>
      <text x="636" y="783" class="externalTitle">视觉 / LLM / Embedding</text>
      <text x="636" y="807" class="externalBody">图片/PDF 或检索文本片段</text>

      <rect x="876" y="754" width="224" height="76" rx="16" fill="#FBF1ED" stroke="#E7B8AA"/>
      <text x="898" y="783" class="externalTitle">USDA / Open Food Facts</text>
      <text x="898" y="807" class="externalBody">仅食物查询词与必要参数</text>

      <rect x="1118" y="754" width="244" height="76" rx="16" fill="#FBF1ED" stroke="#E7B8AA"/>
      <text x="1140" y="783" class="externalTitle">设备文件 / 实验性接入</text>
      <text x="1140" y="807" class="externalBody">仅显式导入或安全授权的数据</text>
    </g>
  </g>
</svg>
